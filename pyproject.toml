[project]
name = "skypro-modul-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.black]
# Максимальная длина строки
line-lenght = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)
'''

[tool.isort]
# Максимальная длина строки
line-lenght = 119
# Импорты будут объединены в одну строку, если возможно
multi_line_output = 3

[tool.mypy]
# Запрещает объявлять функции без аннотации типов
disallow_untyped_defs = true
# Предупреждает, если функция возвращает значение типа any
warn_return_any = true
no_implicit_optional = true
# Файлы, которые не нужно форматировать
exclude='venv'
